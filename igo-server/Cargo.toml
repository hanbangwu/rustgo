[package]
name = "igo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloudflare Worker hosting each igo room in a Durable Object."

[lib]
crate-type = ["cdylib"]

[dependencies]
igo-core = { path = "../igo-core" }

anyhow = "1.0.104"
getrandom = { version = "0.4", features = ["wasm_js"] }
serde = { workspace = true }
serde_json = { workspace = true }
worker = "0.8.7"
