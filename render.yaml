services:
  - type: web
    name: igo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - igo-core/**
        - igo-server/**
        - Cargo.toml
        - Cargo.lock
        - Dockerfile.render
    envVars:
      # The frontend's origin, e.g. https://igo.vercel.app; comma-separate several.
      - key: ALLOWED_ORIGINS
        sync: false
